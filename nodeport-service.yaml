# service.yaml
apiVersion: v1
kind: Service
metadata:
  name: beginner-html-site-service
  labels:
    app: beginner-html-site
spec:
  selector:
    app: beginner-html-site
  type: NodePort
  ports:
  - port: 80           # Internal service port
    targetPort: 80      # Container port
    nodePort: 30010     # Exposed NodePort

